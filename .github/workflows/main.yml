name: iOS Calendar Tests

on:
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Test class to run'
        type: choice
        default: 'All'
        options:
          - All
          - CalendarTest
          - AnotherTest
          - CreateEventTest

jobs:
  run-tests:
    # iOS simulator tests need a Mac with Xcode, the simulator from config.properties,
    # Java, Maven and Appium (with the XCUITest driver) already installed.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run tests
        env:
          TEST_CLASS: ${{ inputs.test_class }}
        run: |
          if [ "$TEST_CLASS" = "All" ]; then
            mvn -B test
          else
            mvn -B test -Dtest="$TEST_CLASS"
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
